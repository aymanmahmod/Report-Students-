<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students Report</title>

    <!-- Bootstrap CSS -->
    <link href="bootstrap-5.2.3-dist/css/bootstrap.rtl.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">

        <!-- Header -->
        <div class="text-center mb-3">
            <h1 class="fw-bold text-primary">Students Report</h1>
            <p class="text-muted">Student Grades Management System</p>
            <p class="text-muted">with Ayman mahmoud </p>
        </div>

        <!-- Students Table -->
        <div class="card shadow-sm border-0 mb-5">
            <div class="card-header bg-primary text-white py-3">
                <h4 class="mb-0">All Students</h4>
            </div>

            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover text-center align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Average</th>
                                <th>Grade</th>
                                <th>Attendance</th>
                                <th>Result</th>
                            </tr>
                        </thead>
                        <tbody id="studentsTable"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Mercy Students -->
        <div class="card shadow-sm border-0 mb-5">
            <div class="card-header bg-warning py-3">
                <h4 class="mb-0">Mercy Students</h4>
            </div>

            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered table-hover text-center align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Old Average</th>
                                <th>New Average</th>
                            </tr>
                        </thead>
                        <tbody id="mercyTable"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Mercy Average -->
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow border-0 text-center">
                    <div class="card-body py-4">
                        <h4 class="text-muted">Mercy Average</h4>
                        <h1 class="text-success fw-bold" id="mercyAverage">0</h1>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>

        class Student {
            constructor(id, name, grades, attendance) {
                this.id = id;
                this.name = name;
                this.grades = grades;
                this.attendance = attendance;
            }

            Average() {
                let total = this.grades.reduce((sum, grade) => {
                    return sum + grade;
                }, 0);

                return total / this.grades.length;
            }

            getGrade(average) {
                if (average >= 90) return "A";
                else if (average >= 80) return "B";
                else if (average >= 70) return "C";
                else if (average >= 60) return "D";
                else if (average >= 50) return "E";
                else return "F";
            }

            getResult() {
                let average = this.Average();

                if (average >= 50 && this.attendance >= 75) {
                    return "ناجح";
                } else {
                    return "يحتاج مراجعة";
                }
            }
        }

        // Students List
        const studentsList = [
            new Student(1, "ayman", [90, 80, 95], 90),
            new Student(2, "ahmed", [45, 48, 44], 80),
            new Student(3, "mohamed", [70, 80, 75], 85),
            new Student(4, "ali", [40, 45, 48], 70),
        ];

        // Display All Students
        const studentsTable = document.getElementById("studentsTable");

        studentsList.forEach(student => {

            const average = student.Average();
            const grade = student.getGrade(average);
            const result = student.getResult();

            studentsTable.innerHTML += `
                <tr>
                    <td>${student.id}</td>
                    <td class="fw-bold">${student.name}</td>
                    <td>${average.toFixed(2)}</td>
                    <td>
                        <span class="badge bg-primary">${grade}</span>
                    </td>
                    <td>${student.attendance}%</td>
                    <td>
                        <span class="badge ${result === "ناجح" ? "bg-success" : "bg-danger"}">
                            ${result}
                        </span>
                    </td>
                </tr>
            `;
        });

        // Struggling Students
        const strugglingStudents = studentsList.filter(student => {
            const average = student.Average();
            return average >= 40 && average <= 49;
        });

        // Add 5 Degrees
        const upgradedgrades = strugglingStudents.map(student => {

            const oldAverage = student.Average();
            const newAverage = oldAverage + 5;

            return {
                id: student.id,
                name: student.name,
                oldAverage: oldAverage,
                newAverage: newAverage
            };
        });

        // Calculate Mercy Average
        const totalNewAverages = upgradedgrades.reduce((sum, student) => {
            return sum + student.newAverage;
        }, 0);

        let upgradedAverge = 0;

        if (strugglingStudents.length > 0) {
            upgradedAverge = totalNewAverages / strugglingStudents.length;
        }

        // Display Mercy Students
        const mercyTable = document.getElementById("mercyTable");

        upgradedgrades.forEach(student => {

            mercyTable.innerHTML += `
                <tr>
                    <td>${student.id}</td>
                    <td class="fw-bold">${student.name}</td>
                    <td>${student.oldAverage.toFixed(2)}</td>
                    <td class="text-success fw-bold">
                        ${student.newAverage.toFixed(2)}
                    </td>
                </tr>
            `;
        });

        // Display Mercy Average
        document.getElementById("mercyAverage").innerText =
            upgradedAverge.toFixed(2);

    </script>

</body>
</html>
